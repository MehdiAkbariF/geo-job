[workspace]
resolver = "2"
members = [
    "crates/geo-types",
    "crates/geo-domain",
    "crates/geo-storage",
    "crates/geo-query",
    "crates/geo-presentation",
    "crates/geo-tiles",
    "crates/geo-geocoding",
    "crates/biz-domain",
    "crates/biz-storage",
    "crates/biz-application",
    "apps/map-api",
    "apps/geo-importer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Core Platform Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono", "migrate", "rust_decimal"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "trace"] }
clap = { version = "4.5", features = ["derive"] }
argon2 = "0.5"
jsonwebtoken = "9.3"
rand = "0.8"
sha2 = "0.10"
rust_decimal = { version = "1.35", features = ["serde-float"] }