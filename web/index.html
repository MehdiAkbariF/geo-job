<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoJob | اپلیکیشن کشف فرصت‌های شغلی مکان‌محور</title>
    
    <!-- فونت وب استاندارد فارسی Vazirmatn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- MapLibre GL JS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --surface: #ffffff;
            --background: #f1f5f9;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --bottom-nav-height: 64px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Vazirmatn', -apple-system, sans-serif;
            background: #0f172a;
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }

        /* لایه اصلی اپلیکیشن */
        .mobile-app-shell {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* نقشه فول اسکرین زیرین */
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: calc(100vh - var(--bottom-nav-height));
            z-index: 1;
        }

        /* نوار بالای سرچ و فیلترها (شناور) */
        .top-app-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none; /* اجازه لمس نقشه */
        }

        .search-card-float {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 8px 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .search-input-field {
            flex: 1;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            color: var(--text-main);
            outline: none;
        }

        .btn-filter-icon {
            background: #f1f5f9;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
        }
        .btn-filter-icon.active { background: var(--primary); color: white; }

        /* نوار افقی اسکرولی شهرهای ایران */
        .city-chips-scroll {
            pointer-events: auto;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 2px 2px 6px;
            scrollbar-width: none;
        }
        .city-chips-scroll::-webkit-scrollbar { display: none; }

        .city-chip {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.2s;
        }
        .city-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* ویجت آدرس‌یابی زنده معکوس (شناور تمیز) */
        .reverse-geo-toast {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            color: white;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 11.5px;
            display: none;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            align-self: center;
            max-width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ==========================================================
           مارکرهای اختصاصی تگ حقوقی پلتفرم (کاملاً فیکس، بدون کشیدگی)
           ========================================================== */
        .map-marker-pill {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: #0f172a;
            color: #ffffff;
            padding: 0 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            height: 28px;
            line-height: 28px;
            white-space: nowrap;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35);
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
            position: relative;
        }
        .map-marker-pill::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 5px 0 5px;
            border-style: solid;
            border-color: #0f172a transparent transparent transparent;
        }
        .map-marker-pill:hover, .map-marker-pill:active {
            transform: scale(1.15) translateY(-3px);
            background: var(--primary);
        }
        .map-marker-pill:hover::after, .map-marker-pill:active::after { border-color: var(--primary) transparent transparent transparent; }
        
        .map-marker-pill.active {
            background: var(--accent-amber) !important;
            color: #0f172a !important;
            border-color: #ffffff !important;
            transform: scale(1.2) translateY(-4px);
            z-index: 1000 !important;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.7);
        }
        .map-marker-pill.active::after { border-color: var(--accent-amber) transparent transparent transparent !important; }

        /* ==========================================================
           باتم شیت تعاملی موبایل (Bottom Sheet Drawer)
           ========================================================== */
        .bottom-sheet {
            position: absolute;
            bottom: var(--bottom-nav-height);
            left: 0;
            width: 100vw;
            background: var(--surface);
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
            z-index: 30;
            display: flex;
            flex-direction: column;
            transition: height 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
            height: 220px; /* حالت نیمه باز اولیه */
        }
        .bottom-sheet.collapsed { height: 75px; }
        .bottom-sheet.expanded { height: 78vh; }

        /* دستگیره لمسی باتم شیت */
        .sheet-handle-bar {
            width: 100%;
            padding: 10px 0 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: grab;
        }
        .sheet-pill {
            width: 44px;
            height: 4.5px;
            background: #cbd5e1;
            border-radius: 4px;
        }
        .sheet-header-title {
            width: 100%;
            padding: 4px 18px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        /* لیست اسکرول کارت‌ها داخل شیت */
        .sheet-content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }

        /* کارت شغل در اپلیکیشن */
        .app-job-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            transition: all 0.2s;
        }
        .app-job-card:active { transform: scale(0.98); }
        .app-job-card.active { border-color: var(--primary); background: #fbfdff; box-shadow: 0 0 0 2px var(--primary); }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .card-job-title { font-size: 13.5px; font-weight: 800; color: var(--text-main); }
        .card-comp-name { font-size: 11.5px; color: var(--primary); font-weight: 700; margin-top: 2px; }

        .card-tags {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .app-badge {
            font-size: 10px;
            padding: 2.5px 7px;
            border-radius: 6px;
            font-weight: 700;
        }
        .b-remote { background: #dcfce7; color: #15803d; }
        .b-hybrid { background: #fef3c7; color: #b45309; }
        .b-onsite { background: #e0f2fe; color: #0369a1; }
        .b-salary { background: #f1f5f9; color: var(--text-main); }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10.5px;
            color: var(--text-muted);
            border-top: 1px dashed var(--border);
            padding-top: 6px;
        }

        /* ==========================================================
           نوار پایین اپ (Bottom Navigation Bar)
           ========================================================== */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: calc(var(--bottom-nav-height) + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            z-index: 40;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #64748b;
            font-size: 10px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            background: transparent;
            font-family: inherit;
            padding: 6px 12px;
            border-radius: 12px;
            transition: all 0.15s;
        }
        .nav-item svg { width: 20px; height: 20px; }
        .nav-item.active { color: var(--primary); }

        /* پنل فیلتر پیشرفته کشویی از پایین */
        .filter-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            background: white;
            border-radius: 24px 24px 0 0;
            z-index: 100;
            box-shadow: 0 -10px 50px rgba(0,0,0,0.3);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        .filter-drawer.open { transform: translateY(0); }

        /* کشوی تمام‌صفحه جزئیات موقعیت شغلی */
        .job-detail-sheet {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 110;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
        }
        .job-detail-sheet.open { transform: translateY(0); }

        .btn-action-full {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;
        }

        /* دسکتاپ: لنگر انداختن به شکل سایدبار استاندارد */
        @media (min-width: 800px) {
            .app-shell { flex-direction: row; }
            #map { width: calc(100vw - 460px); height: 100vh; right: 460px; }
            .top-app-bar { right: 476px; max-width: 500px; }
            .bottom-sheet {
                position: relative;
                width: 460px;
                height: 100vh !important;
                border-radius: 0;
                box-shadow: -4px 0 25px rgba(0,0,0,0.08);
                border-left: 1px solid var(--border);
                bottom: 0;
            }
            .sheet-handle-bar { display: none; }
            .bottom-nav { width: 460px; right: 0; left: auto; }
            .job-detail-sheet { width: 460px; left: auto; right: 0; }
        }
    </style>
</head>
<body>

    <div class="mobile-app-shell">
        <!-- نقشه MapLibre تمام صفحه -->
        <div id="map"></div>

        <!-- نوار بالای نقشه (سرچ + فیلتر + شهرها + ریورس جئو) -->
        <div class="top-app-bar">
            <div class="search-card-float">
                <svg width="18" height="18" fill="none" stroke="#64748b" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" id="app-search-input" class="search-input-field" placeholder="جستجوی عنوان شغلی، شرکت یا مهارت..." oninput="debounceSearch()" />
                <button class="btn-filter-icon" id="btn-toggle-filters" onclick="toggleFilterDrawer()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                </button>
            </div>

            <div class="city-chips-scroll">
                <button class="city-chip active" onclick="flyToCity(51.39, 35.72, 12, this)">📍 تهران</button>
                <button class="city-chip" onclick="flyToCity(51.66, 32.65, 12, this)">اصفهان</button>
                <button class="city-chip" onclick="flyToCity(59.57, 36.30, 12, this)">مشهد</button>
                <button class="city-chip" onclick="flyToCity(52.52, 29.63, 12, this)">شیراز</button>
                <button class="city-chip" onclick="flyToCity(46.36, 38.05, 12, this)">تبریز</button>
            </div>

            <!-- توست آدرس‌یابی معکوس در هنگام تپ کردن روی هر نقطه -->
            <div class="reverse-geo-toast" id="reverse-geo-toast">
                <span>📍</span>
                <span id="reverse-geo-text">در حال استخراج نام محله...</span>
            </div>
        </div>

        <!-- باتم شیت لیست مشاغل (Bottom Sheet) -->
        <div class="bottom-sheet" id="bottom-sheet">
            <div class="sheet-handle-bar" onclick="cycleBottomSheet()">
                <div class="sheet-pill"></div>
            </div>
            
            <div class="sheet-header-title">
                <span id="sheet-results-count">در حال جستجو...</span>
                <span style="color:var(--primary); font-size:11px; cursor:pointer;" onclick="cycleBottomSheet()" id="sheet-toggle-text">بزرگنمایی ↑</span>
            </div>

            <div class="sheet-content-scroll" id="jobs-cards-container">
                <!-- کارت‌های شغلی داینامیک با رندر تمیز -->
            </div>
        </div>

        <!-- نوار پایین اپلیکیشن (Bottom Navigation) -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchMainTab('explore')">
                <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                <span>کشف و نقشه</span>
            </button>
            <button class="nav-item" onclick="switchMainTab('saved')">
                <svg fill="currentColor" viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                <span>نشان‌شده‌ها</span>
            </button>
            <button class="nav-item" onclick="switchMainTab('applied')">
                <svg fill="currentColor" viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                <span>درخواست‌های من</span>
            </button>
            <button class="nav-item" onclick="switchMainTab('ats')">
                <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>
                <span>میز کارفرما</span>
            </button>
            <button class="nav-item" onclick="handleAuthTrigger()">
                <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span id="nav-user-label">ورود</span>
            </button>
        </nav>
    </div>

    <!-- کشوی بازشونده جزئیات کامل آگهی و فرم اپلای -->
    <div class="job-detail-sheet" id="job-detail-sheet">
        <div style="padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
            <button style="border: none; background: #f1f5f9; width: 32px; height: 32px; border-radius: 8px; font-weight: 700;" onclick="closeJobDetail()">←</button>
            <span style="font-weight: 800; font-size: 13px;" id="sheet-detail-company">نام شرکت</span>
            <div style="width:32px;"></div>
        </div>
        <div style="flex: 1; overflow-y: auto; padding: 20px;" id="sheet-detail-body">
            <!-- محتوای آگهی -->
        </div>
        <div style="padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 10px;">
            <button class="btn-action-full" onclick="openApplyPrompt()">ارسال رزومه و درخواست همکاری</button>
        </div>
    </div>

    <!-- کشوی فیلترهای پیشرفته -->
    <div class="filter-drawer" id="filter-drawer">
        <div style="padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
            <b style="font-size: 14px;">فیلترهای پیشرفته</b>
            <button style="border: none; background: transparent; font-size: 16px;" onclick="toggleFilterDrawer()">✕</button>
        </div>
        <div style="padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;">
            <div>
                <label style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">حداقل حقوق ماهانه:</label>
                <div style="display:flex; justify-content:space-between; margin:6px 0 4px; font-size:12px; font-weight:700; color:var(--primary);">
                    <span>مبلغ:</span>
                    <span id="filter-salary-val">بدون محدودیت</span>
                </div>
                <input type="range" id="filter-salary-slider" min="0" max="90000000" step="5000000" value="0" style="width:100%" oninput="updateSalaryText(this.value)" />
            </div>

            <div>
                <label style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">دسته‌بندی شغلی:</label>
                <select id="filter-cat-select" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 10px; font-family: inherit; margin-top: 4px;">
                    <option value="">همه حوزه‌ها</option>
                </select>
            </div>

            <div>
                <label style="font-size: 11.5px; font-weight: 700; color: var(--text-muted);">روش همکاری:</label>
                <div style="display: flex; gap: 6px; margin-top: 6px;">
                    <button class="city-chip active" id="f-work-all" onclick="setWorkplaceFilter('', this)">همه</button>
                    <button class="city-chip" id="f-work-remote" onclick="setWorkplaceFilter('remote', this)">دورکاری</button>
                    <button class="city-chip" id="f-work-hybrid" onclick="setWorkplaceFilter('hybrid', this)">هیبرید</button>
                    <button class="city-chip" id="f-work-onsite" onclick="setWorkplaceFilter('onsite', this)">حضوری</button>
                </div>
            </div>
        </div>
        <div style="padding: 16px; border-top: 1px solid var(--border);">
            <button class="btn-action-full" onclick="applyAdvancedFilters()">اعمال فیلترها</button>
        </div>
    </div>

    <script>
        const MAP_API = "http://localhost:8080";
        const BIZ_API = "http://localhost:8081";

        let mapMarkers = [];
        let currentJobs = [];
        let activeJob = null;
        let selectedWorkplace = '';
        let searchTimer = null;
        let bottomSheetState = 'peek'; // 'collapsed' | 'peek' | 'expanded'
        let currentNavTab = 'explore';
        let savedJobsCache = new Set();

        if (maplibregl.getRTLTextPluginStatus() === 'unavailable') {
            maplibregl.setRTLTextPlugin('https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js', null, true);
        }

        // نقشه اختصاصی وکتوری با کنتراست فوق‌العاده
        const map = new maplibregl.Map({
            container: 'map',
            center: [51.39, 35.72],
            zoom: 12,
            minZoom: 4,
            maxZoom: 18,
            style: {
                version: 8,
                glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
                sources: {
                    'base_tiles': {
                        type: 'vector',
                        tiles: [`${MAP_API}/api/v1/base-tiles/{z}/{x}/{y}.mvt`],
                        minzoom: 4,
                        maxzoom: 18
                    }
                },
                layers: [
                    { id: 'background', type: 'background', paint: { 'background-color': '#f8fafc' } },
                    {
                        id: 'boundaries',
                        type: 'line',
                        source: 'base_tiles',
                        'source-layer': 'boundaries',
                        paint: { 'line-color': '#94a3b8', 'line-width': 1.2, 'line-dasharray': [3, 2] }
                    },
                    {
                        id: 'roads_minor_casing',
                        type: 'line',
                        source: 'base_tiles',
                        'source-layer': 'roads',
                        filter: ['!in', 'highway', 'motorway', 'trunk', 'primary', 'secondary'],
                        paint: { 'line-color': '#cbd5e1', 'line-width': 3.5 }
                    },
                    {
                        id: 'roads_minor_core',
                        type: 'line',
                        source: 'base_tiles',
                        'source-layer': 'roads',
                        filter: ['!in', 'highway', 'motorway', 'trunk', 'primary', 'secondary'],
                        paint: { 'line-color': '#ffffff', 'line-width': 2.2 }
                    },
                    {
                        id: 'roads_primary_casing',
                        type: 'line',
                        source: 'base_tiles',
                        'source-layer': 'roads',
                        filter: ['in', 'highway', 'primary', 'secondary', 'tertiary'],
                        paint: { 'line-color': '#d97706', 'line-width': 5.5 }
                    },
                    {
                        id: 'roads_primary_core',
                        type: 'line',
                        source: 'base_tiles',
                        'source-layer': 'roads',
                        filter: ['in', 'highway', 'primary', 'secondary', 'tertiary'],
                        paint: { 'line-color': '#fde047', 'line-width': 4.0 }
                    },
                    {
                        id: 'roads_motorway_casing',
                        type: 'line',
                        source: 'base_tiles',
                        'source-layer': 'roads',
                        filter: ['in', 'highway', 'motorway', 'trunk'],
                        paint: { 'line-color': '#9a3412', 'line-width': 7.5 }
                    },
                    {
                        id: 'roads_motorway_core',
                        type: 'line',
                        source: 'base_tiles',
                        'source-layer': 'roads',
                        filter: ['in', 'highway', 'motorway', 'trunk'],
                        paint: { 'line-color': '#ea580c', 'line-width': 5.5 }
                    },
                    {
                        id: 'roads_labels',
                        type: 'symbol',
                        source: 'base_tiles',
                        'source-layer': 'roads',
                        filter: ['has', 'name'],
                        layout: {
                            'symbol-placement': 'line',
                            'text-field': ['get', 'name'],
                            'text-size': 12,
                            'text-font': ['Noto Sans Regular'],
                            'text-max-angle': 40,
                            'symbol-spacing': 250
                        },
                        paint: {
                            'text-color': '#0f172a',
                            'text-halo-color': '#ffffff',
                            'text-halo-width': 3.0
                        }
                    }
                ]
            }
        });

        async function api(url, opts = {}) {
            const token = localStorage.getItem('token');
            const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            return fetch(url, { ...opts, headers });
        }

        // واکشی مشاغل دیدگاه کادر نقشه
        async function fetchJobs() {
            if (currentNavTab !== 'explore') return;

            const bounds = map.getBounds();
            const bbox = `${bounds.getWest()},${bounds.getSouth()},${bounds.getEast()},${bounds.getNorth()}`;
            const q = document.getElementById('app-search-input').value.trim();
            const cat = document.getElementById('filter-cat-select').value;
            const salary = document.getElementById('filter-salary-slider').value;

            let url = `${BIZ_API}/api/v1/opportunities/search?bbox=${bbox}&limit=40`;
            if (q) url += `&q=${encodeURIComponent(q)}`;
            if (cat) url += `&category_id=${cat}`;
            if (selectedWorkplace) url += `&workplace_type=${selectedWorkplace}`;
            if (salary > 0) url += `&salary_min=${salary}`;

            try {
                const res = await api(url);
                if (res.ok) {
                    const data = await res.json();
                    currentJobs = data.items || [];
                    renderCards(currentJobs);
                    renderPillMarkers(currentJobs);
                }
            } catch (e) {}
        }

        // رندر کارت‌ها در باتم‌شیت
        function renderCards(jobs) {
            const container = document.getElementById('jobs-cards-container');
            document.getElementById('sheet-results-count').innerText = `${jobs.length} فرصت شغلی فعال در کادر نقشه`;
            container.innerHTML = '';

            if (jobs.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 30px; color: #94a3b8; font-size:12px;">در این کادر هیچ موقعیت شغلی یافت نشد.<br>نقشه را حرکت دهید.</div>`;
                return;
            }

            jobs.forEach(j => {
                const isSaved = savedJobsCache.has(j.id);
                const card = document.createElement('div');
                card.className = `app-job-card ${activeJob && activeJob.id === j.id ? 'active' : ''}`;
                card.id = `card-${j.id}`;
                card.onclick = () => showJobDetail(j);

                const wBadge = j.workplace_type === 'remote' 
                    ? '<span class="app-badge b-remote">دورکاری</span>' 
                    : (j.workplace_type === 'hybrid' ? '<span class="app-badge b-hybrid">هیبرید</span>' : '<span class="app-badge b-onsite">حضوری</span>');

                const salStr = j.salary_min 
                    ? `از ${(j.salary_min / 1000000).toFixed(0)} تا ${(j.salary_max / 1000000).toFixed(0)} م.ت` 
                    : 'حقوق توافقی';

                card.innerHTML = `
                    <div class="card-top">
                        <div>
                            <div class="card-job-title">${j.title}</div>
                            <div class="card-comp-name">${j.company.name}</div>
                        </div>
                        <button style="border:none; background:transparent; font-size:16px; color:${isSaved ? '#f59e0b':'#cbd5e1'};" onclick="toggleSave('${j.id}', event)">★</button>
                    </div>
                    <div class="card-tags">
                        ${wBadge}
                        <span class="app-badge b-salary">${salStr}</span>
                    </div>
                    <div class="card-bottom">
                        <span>📍 ${j.location_summary || 'محدوده شهری'}</span>
                        <span style="font-weight:700; color:var(--primary)">مشاهده ←</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ==========================================================
        // رندر مارکرهای تگ حقوقی روی نقشه (بدون کشیدگی و کاملاً فیکس)
        // ==========================================================
        function renderPillMarkers(jobs) {
            mapMarkers.forEach(m => m.remove());
            mapMarkers = [];

            jobs.forEach(job => {
                if (!job.coordinates || job.coordinates.length !== 2) return;

                const el = document.createElement('div');
                el.className = 'map-marker-pill';
                el.id = `pill-${job.id}`;

                const shortSalary = job.salary_min ? `${(job.salary_min / 1000000).toFixed(0)} م` : 'توافقی';
                el.innerHTML = `<span>💼</span><span>${shortSalary}</span>`;

                el.onclick = (e) => {
                    e.stopPropagation();
                    showJobDetail(job);
                };

                const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
                    .setLngLat(job.coordinates)
                    .addTo(map);

                mapMarkers.push(marker);
            });
        }

        function showJobDetail(job) {
            activeJob = job;

            // هایلایت مارکر
            document.querySelectorAll('.map-marker-pill').forEach(p => p.classList.remove('active'));
            const p = document.getElementById(`pill-${job.id}`);
            if (p) p.classList.add('active');

            // نمایش در شیت
            document.getElementById('sheet-detail-company').innerText = job.company.name;
            document.getElementById('sheet-detail-body').innerHTML = `
                <h2 style="font-size: 16px; font-weight: 800; margin-bottom: 8px;">${job.title}</h2>
                <div style="display:flex; gap: 6px; margin-bottom: 16px;">
                    <span class="app-badge b-salary">${job.workplace_type}</span>
                    <span class="app-badge b-salary">${job.experience_level}</span>
                </div>
                <h4 style="font-size: 13px; font-weight: 800; margin-bottom: 4px;">درباره فرصت شغلی:</h4>
                <p style="color: #475569; font-size: 13px; line-height: 1.8; margin-bottom: 20px;">${job.description_summary}</p>
                <h4 style="font-size: 13px; font-weight: 800; margin-bottom: 4px;">موقعیت فیزیکی:</h4>
                <p style="color: #475569; font-size: 13px;">📍 ${job.location_summary || 'روی نقشه مشخص شده است'}</p>
            `;

            document.getElementById('job-detail-sheet').classList.add('open');

            if (job.coordinates) {
                map.flyTo({ center: job.coordinates, zoom: 14, speed: 1.2 });
            }
        }
        function closeJobDetail() { document.getElementById('job-detail-sheet').classList.remove('open'); }

        // کنترل باتم‌شیت لمسی
        function cycleBottomSheet() {
            const sheet = document.getElementById('bottom-sheet');
            const txt = document.getElementById('sheet-toggle-text');
            if (bottomSheetState === 'peek') {
                sheet.className = 'bottom-sheet expanded';
                bottomSheetState = 'expanded';
                txt.innerText = 'کوچک‌نمایی ↓';
            } else {
                sheet.className = 'bottom-sheet';
                bottomSheetState = 'peek';
                txt.innerText = 'بزرگنمایی ↑';
            }
        }

        // ناوبری تب‌های پایین
        async function switchMainTab(tab) {
            currentNavTab = tab;
            document.querySelectorAll('.bottom-nav .nav-item').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const sheet = document.getElementById('bottom-sheet');

            if (tab === 'explore') {
                sheet.style.display = 'flex';
                fetchJobs();
            } else if (tab === 'saved') {
                sheet.style.display = 'flex';
                sheet.className = 'bottom-sheet expanded';
                document.getElementById('sheet-results-count').innerText = 'فرصت‌های نشان‌شده شما';
                const res = await api(`${BIZ_API}/api/v1/me/saved-opportunities`);
                if (res.ok) {
                    const jobs = await res.json();
                    renderCards(jobs);
                    renderPillMarkers(jobs);
                }
            } else if (tab === 'applied') {
                sheet.style.display = 'flex';
                sheet.className = 'bottom-sheet expanded';
                document.getElementById('sheet-results-count').innerText = 'رهگیری درخواست‌های ارسالی شما';
                const res = await api(`${BIZ_API}/api/v1/candidates/me/applications`);
                if (res.ok) {
                    const apps = await res.json();
                    const container = document.getElementById('jobs-cards-container');
                    container.innerHTML = apps.length === 0 ? '<div style="text-align:center; padding:30px; color:#94a3b8;">هنوز درخواستی ارسال نکرده‌اید.</div>' : '';
                    apps.forEach(a => {
                        container.innerHTML += `
                            <div class="app-job-card" style="cursor:default;">
                                <div class="card-job-title">درخواست شماره: ${a.application_id.substring(0,8)}</div>
                                <div><span class="app-badge b-salary">وضعیت: ${a.status}</span></div>
                                <div style="font-size:11px; color:#64748b;">تاریخ: ${new Date(a.created_at).toLocaleDateString('fa-IR')}</div>
                            </div>
                        `;
                    });
                }
            } else if (tab === 'ats') {
                sheet.style.display = 'flex';
                sheet.className = 'bottom-sheet expanded';
                document.getElementById('sheet-results-count').innerText = 'میز کارفرما - مدیریت متقاضیان (ATS)';
                document.getElementById('jobs-cards-container').innerHTML = `
                    <div style="background:#eff6ff; padding:12px; border-radius:10px; margin-bottom:10px; font-size:12px;">
                        <b>شرکت فعال:</b> ابر دیوان | ۲ متقاضی جدید در صف مصاحبه
                    </div>
                    <div class="app-job-card">
                        <div class="card-job-title">سارا احمدی (توسعه‌دهنده Rust)</div>
                        <div style="font-size:11px; color:#475569;">۵ سال سابقه | فارغ‌التحصیل دانشگاه شریف</div>
                        <div style="display:flex; gap:6px; margin-top:8px;">
                            <button class="app-badge b-remote" style="border:none; cursor:pointer;" onclick="alert('دعوت به مصاحبه ارسال شد.')">دعوت به مصاحبه</button>
                            <button class="app-badge b-salary" style="border:none; cursor:pointer;" onclick="alert('رزومه باز شد.')">دانلود رزومه</button>
                        </div>
                    </div>
                `;
            }
        }

        // کشف آدرس معکوس با کلیک روی هر نقطه نقشه
        map.on('click', async (e) => {
            const { lng, lat } = e.lngLat;
            const toast = document.getElementById('reverse-geo-toast');
            const toastText = document.getElementById('reverse-geo-text');

            toast.style.display = 'flex';
            toastText.innerText = 'در حال استخراج نام معبر...';

            try {
                const res = await fetch(`${MAP_API}/api/v1/reverse-geocoding?lat=${lat}&lon=${lng}`);
                if (res.ok) {
                    const data = await res.json();
                    toastText.innerText = data.formatted_address || 'موقعیت در محدوده شهری';
                }
            } catch { toastText.innerText = 'موقعیت در ایران'; }
        });

        map.on('moveend', fetchJobs);
        map.on('load', () => {
            loadCategories();
            fetchJobs();
            checkUser();
        });

        function flyToCity(lng, lat, zoom, btn) {
            document.querySelectorAll('.city-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            map.flyTo({ center: [lng, lat], zoom: zoom, essential: true });
        }

        function toggleFilterDrawer() {
            document.getElementById('filter-drawer').classList.toggle('open');
        }

        function updateSalaryText(val) {
            document.getElementById('filter-salary-val').innerText = val > 0 ? `${(val/1000000).toFixed(0)} میلیون تومان` : 'بدون محدودیت';
        }

        function setWorkplaceFilter(val, btn) {
            selectedWorkplace = val;
            document.querySelectorAll('#filter-drawer .city-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
        }

        function applyAdvancedFilters() {
            toggleFilterDrawer();
            fetchJobs();
        }

        function debounceSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(fetchJobs, 300);
        }

        async function toggleSave(id, e) {
            e.stopPropagation();
            if (!localStorage.getItem('token')) return alert('لطفاً ابتدا وارد شوید.');
            const isSaved = savedJobsCache.has(id);
            const method = isSaved ? 'DELETE' : 'POST';
            const res = await api(`${BIZ_API}/api/v1/opportunities/${id}/save`, { method });
            if (res.ok) {
                if (isSaved) savedJobsCache.delete(id);
                else savedJobsCache.add(id);
                renderCards(currentJobs);
            }
        }

        async function openApplyPrompt() {
            if (!localStorage.getItem('token')) return alert('لطفاً ابتدا وارد حساب خود شوید.');
            const cover = prompt('پیام کوتاه یا کاورلتر برای این فرصت شغلی:');
            if (cover !== null) {
                const res = await api(`${BIZ_API}/api/v1/opportunities/${activeJob.id}/applications`, {
                    method: 'POST',
                    body: JSON.stringify({ opportunity_id: activeJob.id, cover_letter: cover, resume_id: null })
                });
                if (res.ok) {
                    alert('درخواست شما با موفقیت برای کارفرما ارسال شد!');
                    closeJobDetail();
                } else {
                    alert('شما قبلاً برای این فرصت اپلای کرده‌اید.');
                }
            }
        }

        async function loadCategories() {
            try {
                const res = await api(`${BIZ_API}/api/v1/taxonomies/categories`);
                if (res.ok) {
                    const cats = await res.json();
                    const sel = document.getElementById('filter-cat-select');
                    cats.forEach(c => { sel.innerHTML += `<option value="${c.id}">${c.name}</option>`; });
                }
            } catch (e) {}
        }

        function checkUser() {
            const token = localStorage.getItem('token');
            const label = document.getElementById('nav-user-label');
            label.innerText = token ? 'پروفایل' : 'ورود';
        }

        async function handleAuthTrigger() {
            if (localStorage.getItem('token')) {
                if (confirm('آیا می‌خواهید از حساب خود خارج شوید؟')) {
                    localStorage.clear();
                    checkUser();
                    fetchJobs();
                }
            } else {
                const email = prompt('ایمیل خود را وارد کنید:', 'demo@geojob.ir');
                if (!email) return;
                const password = prompt('کلمه عبور:', 'Password1234!');
                if (!password) return;

                let res = await api(`${BIZ_API}/api/v1/auth/login`, {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                if (!res.ok) {
                    res = await api(`${BIZ_API}/api/v1/auth/register`, {
                        method: 'POST',
                        body: JSON.stringify({ email, password, phone: null })
                    });
                }

                if (res.ok) {
                    const d = await res.json();
                    localStorage.setItem('token', d.access_token);
                    checkUser();
                    alert('با موفقیت وارد شدید!');
                }
            }
        }
    </script>
</body>
</html>
