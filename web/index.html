<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>کشف فرصت‌های شغلی مبتنی بر نقشه | Geo-Job</title>
    
    <!-- فونت استاندارد وب فارسی Vazirmatn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- MapLibre GL JS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --surface: #ffffff;
            --background: #f8fafc;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --sidebar-width: 480px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* چیدمان اصلی دسکتاپ (Split Layout) */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* ستون لیست فرصت‌ها */
        .sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 20;
            box-shadow: -4px 0 20px rgba(0,0,0,0.05);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* سربرگ جستجو و ابزارها */
        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .brand-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .api-status {
            display: flex;
            gap: 6px;
        }

        .status-pill {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }
        .status-online { background: #dcfce7; color: #15803d; }
        .status-offline { background: #fee2e2; color: #b91c1c; }

        /* نوار جستجوی زنده */
        .search-input-wrapper {
            position: relative;
            margin-bottom: 10px;
        }

        .search-input {
            width: 100%;
            padding: 10px 38px 10px 14px;
            background: #f1f5f9;
            border: 1px solid transparent;
            border-radius: 10px;
            font-family: inherit;
            font-size: 13px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }
        .search-input:focus {
            background: var(--surface);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* چیپ‌های پرش به شهرها و فیلترها */
        .filters-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .filters-scroll::-webkit-scrollbar { display: none; }

        .chip {
            padding: 5px 12px;
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.15s;
        }
        .chip:hover { background: #e2e8f0; color: var(--text-main); }
        .chip.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: 600; }

        /* لیست کارت‌های شغلی */
        .jobs-scroll-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .results-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* کارت فرصت شغلی */
        .job-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .job-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            transform: translateY(-2px);
        }
        .job-card.highlighted {
            border-color: var(--primary);
            background: #f8faff;
            box-shadow: 0 0 0 2px var(--primary);
        }

        .job-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .company-logo-placeholder {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #475569;
            flex-shrink: 0;
        }

        .job-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .company-name {
            font-size: 12px;
            color: var(--primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .verified-tick {
            color: #0284c7;
            display: inline-block;
            width: 14px;
            height: 14px;
        }

        .job-tags {
            display: flex;
            gap: 6px;
            margin: 12px 0 8px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 10.5px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 500;
        }
        .badge-remote { background: #dcfce7; color: #15803d; }
        .badge-hybrid { background: #fef3c7; color: #b45309; }
        .badge-onsite { background: #e0f2fe; color: #0369a1; }
        .badge-salary { background: #f1f5f9; color: var(--text-main); font-weight: 600; }

        .job-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px dashed var(--border);
            padding-top: 10px;
            margin-top: 8px;
        }

        /* نقشه MapLibre */
        .map-container {
            flex: 1;
            height: 100%;
            position: relative;
        }
        #map { width: 100%; height: 100%; }

        /* دکمه شناور جابجایی بین نقشه و لیست در موبایل */
        .mobile-toggle-btn {
            display: none;
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            background: var(--text-main);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            cursor: pointer;
            align-items: center;
            gap: 8px;
        }

        /* کشوی جزئیات آگهی (Detail Drawer) */
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 500px;
            max-width: 100vw;
            height: 100vh;
            background: var(--surface);
            z-index: 50;
            box-shadow: 10px 0 40px rgba(0,0,0,0.15);
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }
        .drawer.open { transform: translateX(0); }

        .drawer-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            line-height: 1.8;
            font-size: 13.5px;
        }
        .drawer-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .btn-apply {
            flex: 1;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-apply:hover { background: var(--primary-hover); }

        .btn-close {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
        }

        /* پاپ‌آپ ماژولار درخواست همکاری */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: white;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
        }

        /* رسپانسیو برای موبایل */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100vw;
                height: 65vh;
                border-left: none;
                border-top: 1px solid var(--border);
                border-radius: 20px 20px 0 0;
                transform: translateY(calc(100% - 70px));
            }
            .sidebar.mobile-expanded {
                transform: translateY(0);
                height: 90vh;
            }
            .mobile-toggle-btn { display: flex; }
            .drawer { width: 100vw; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ستون لیست آگهی‌ها -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-row">
                    <div class="brand-title">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                        GeoJob
                    </div>
                    <div class="api-status">
                        <span id="status-map" class="status-pill status-online">Map: 8080</span>
                        <span id="status-biz" class="status-pill status-online">Biz: 8081</span>
                    </div>
                </div>

                <div class="search-input-wrapper">
                    <input type="text" id="search-input" class="search-input" placeholder="عنوان شغلی، مهارت یا شرکت..." oninput="handleSearchInput(event)" />
                    <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>

                <div class="filters-scroll">
                    <button class="chip active" onclick="setCityFilter('tehran', 51.39, 35.72, 12, this)">تهران</button>
                    <button class="chip" onclick="setCityFilter('isfahan', 51.66, 32.65, 12, this)">اصفهان</button>
                    <button class="chip" onclick="setCityFilter('mashhad', 59.57, 36.30, 12, this)">مشهد</button>
                    <button class="chip" onclick="setCityFilter('shiraz', 52.52, 29.63, 12, this)">شیراز</button>
                    <button class="chip" onclick="setCityFilter('tabriz', 46.36, 38.05, 12, this)">تبریز</button>
                    <button class="chip" id="filter-remote" onclick="toggleRemoteFilter(this)">دورکاری</button>
                </div>
            </div>

            <div class="jobs-scroll-list" id="jobs-list">
                <div class="results-meta">
                    <span id="results-count">در حال واکشی فرصت‌های محدوده...</span>
                </div>
                <!-- کارت‌های شغلی داینامیک اضافه می‌شوند -->
            </div>
        </aside>

        <!-- نقشه MapLibre -->
        <main class="map-container">
            <div id="map"></div>
            <button class="mobile-toggle-btn" id="mobile-toggle" onclick="toggleMobileSidebar()">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                <span id="mobile-toggle-text">مشاهده لیست</span>
            </button>
        </main>
    </div>

    <!-- کشوی نمایش جزئیات کامل شغل -->
    <div class="drawer" id="job-drawer">
        <div class="drawer-header">
            <div id="drawer-company" class="company-name">نام شرکت</div>
            <button class="btn-close" onclick="closeDrawer()">✕</button>
        </div>
        <div class="drawer-body" id="drawer-content"></div>
        <div class="drawer-footer">
            <button class="btn-apply" onclick="openApplyModal()">ارسال درخواست همکاری (Apply)</button>
        </div>
    </div>

    <!-- مودال ثبت سریع رزومه -->
    <div class="modal-overlay" id="apply-modal">
        <div class="modal-card">
            <h3 style="margin-bottom: 12px; font-size: 16px;">ارسال درخواست همکاری</h3>
            <p id="apply-modal-job-title" style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;"></p>
            <textarea id="apply-cover-letter" style="width: 100%; height: 100px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 13px;" placeholder="پیام کوتاه یا توضیحات برای کارفرما (اختیاری)..."></textarea>
            <div style="display: flex; gap: 8px; margin-top: 16px;">
                <button class="btn-apply" onclick="submitApplication()">ارسال نهایی درخواست</button>
                <button class="chip" style="padding: 10px 16px;" onclick="closeApplyModal()">انصراف</button>
            </div>
        </div>
    </div>

    <script>
        const MAP_API = "http://localhost:8080";
        const BIZ_API = "http://localhost:8081";

        let currentJobs = [];
        let activeJobId = null;
        let isRemoteOnly = false;
        let searchTimeout = null;

        // فعال‌سازی پلاگین زبان فارسی MapLibre
        if (maplibregl.getRTLTextPluginStatus() === 'unavailable') {
            maplibregl.setRTLTextPlugin('https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js', null, true);
        }

        // نقشه تعاملی با تم اختصاصی شهری
        const map = new maplibregl.Map({
            container: 'map',
            center: [51.39, 35.72],
            zoom: 12,
            minZoom: 4,
            maxZoom: 18,
            style: {
                version: 8,
                glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
                sources: {
                    'base_tiles': {
                        type: 'vector',
                        tiles: [`${MAP_API}/api/v1/base-tiles/{z}/{x}/{y}.mvt`],
                        minzoom: 4,
                        maxzoom: 18
                    },
                    'job_markers': {
                        type: 'geojson',
                        data: { type: 'FeatureCollection', features: [] }
                    }
                },
                layers: [
                    { id: 'background', type: 'background', paint: { 'background-color': '#f1f5f9' } },
                    {
                        id: 'roads_minor',
                        type: 'line',
                        source: 'base_tiles',
                        'source-layer': 'roads',
                        paint: { 'line-color': '#ffffff', 'line-width': 2.0 }
                    },
                    {
                        id: 'roads_primary',
                        type: 'line',
                        source: 'base_tiles',
                        'source-layer': 'roads',
                        filter: ['in', 'highway', 'primary', 'secondary', 'trunk', 'motorway'],
                        paint: { 'line-color': '#fbbf24', 'line-width': 4.0 }
                    },
                    {
                        id: 'employer_markers_glow',
                        type: 'circle',
                        source: 'job_markers',
                        paint: {
                            'circle-radius': 14,
                            'circle-color': '#3b82f6',
                            'circle-opacity': 0.25
                        }
                    },
                    {
                        id: 'employer_markers',
                        type: 'circle',
                        source: 'job_markers',
                        paint: {
                            'circle-radius': 7.5,
                            'circle-color': '#2563eb',
                            'circle-stroke-width': 2.5,
                            'circle-stroke-color': '#ffffff'
                        }
                    }
                ]
            }
        });

        // واکشی همگام مشاغل هنگام حرکت نقشه (Search as I move the map)
        async function fetchJobsInViewport() {
            const bounds = map.getBounds();
            const bboxStr = `${bounds.getWest()},${bounds.getSouth()},${bounds.getEast()},${bounds.getNorth()}`;
            const q = document.getElementById('search-input').value.trim();

            let url = `${BIZ_API}/api/v1/opportunities/search?bbox=${bboxStr}&limit=40`;
            if (q) url += `&q=${encodeURIComponent(q)}`;
            if (isRemoteOnly) url += `&workplace_type=remote`;

            try {
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    currentJobs = data.items || [];
                    renderJobsList(currentJobs);
                    updateMapMarkers(currentJobs);
                }
            } catch (err) {
                console.error("Error fetching viewport jobs:", err);
            }
        }

        // رندر کارت‌های شغلی در سایدبار
        function renderJobsList(jobs) {
            const container = document.getElementById('jobs-list');
            const countEl = document.getElementById('results-count');
            countEl.innerText = `${jobs.length} فرصت شغلی در این محدوده`;

            // حفظ المنت نتایج و حذف کارت‌های قدیمی
            container.querySelectorAll('.job-card').forEach(el => el.remove());

            if (jobs.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'job-card';
                empty.style.textAlign = 'center';
                empty.style.color = '#94a3b8';
                empty.innerText = 'در این محدوده هیچ فرصت شغلی فعالی یافت نشد. کادر نقشه را جابجا کنید.';
                container.appendChild(empty);
                return;
            }

            jobs.forEach(job => {
                const card = document.createElement('div');
                card.className = `job-card ${job.id === activeJobId ? 'highlighted' : ''}`;
                card.id = `card-${job.id}`;
                card.onclick = () => selectJob(job);
                card.onmouseenter = () => highlightMarkerOnMap(job);

                const workplaceBadge = job.workplace_type === 'remote' 
                    ? '<span class="badge badge-remote">دورکاری</span>'
                    : (job.workplace_type === 'hybrid' ? '<span class="badge badge-hybrid">هیبرید</span>' : '<span class="badge badge-onsite">حضوری</span>');

                const salaryText = job.salary_min 
                    ? `از ${(job.salary_min / 1000000).toFixed(0)} تا ${(job.salary_max / 1000000).toFixed(0)} م.ت`
                    : 'حقوق توافقی';

                const companyInitial = job.company.name.charAt(0);

                card.innerHTML = `
                    <div class="job-card-header">
                        <div>
                            <div class="job-title">${job.title}</div>
                            <div class="company-name">
                                ${job.company.name}
                                <svg class="verified-tick" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                            </div>
                        </div>
                        <div class="company-logo-placeholder">${companyInitial}</div>
                    </div>
                    <div class="job-tags">
                        ${workplaceBadge}
                        <span class="badge badge-salary">${salaryText}</span>
                    </div>
                    <div class="job-footer">
                        <span>📍 ${job.location_summary || 'محدوده مرکزی'}</span>
                        <span>مشاهده و ارسال رزومه ←</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // نمایش پین‌های نقشه
        function updateMapMarkers(jobs) {
            const features = jobs
                .filter(j => j.coordinates && j.coordinates.length === 2)
                .map(j => ({
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: j.coordinates },
                    properties: { id: j.id, title: j.title, company: j.company.name }
                }));

            map.getSource('job_markers').setData({
                type: 'FeatureCollection',
                features: features
            });
        }

        // انتخاب و باز شدن یک شغل
        function selectJob(job) {
            activeJobId = job.id;
            document.querySelectorAll('.job-card').forEach(c => c.classList.remove('highlighted'));
            const selectedCard = document.getElementById(`card-${job.id}`);
            if (selectedCard) {
                selectedCard.classList.add('highlighted');
                selectedCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            if (job.coordinates) {
                map.flyTo({ center: job.coordinates, zoom: 14, speed: 1.2 });
            }

            openDrawer(job);
        }

        function highlightMarkerOnMap(job) {
            if (job.coordinates) {
                map.getSource('job_markers').setData({
                    type: 'FeatureCollection',
                    features: currentJobs.filter(j => j.coordinates).map(j => ({
                        type: 'Feature',
                        geometry: { type: 'Point', coordinates: j.coordinates },
                        properties: {
                            id: j.id,
                            is_active: j.id === job.id
                        }
                    }))
                });
            }
        }

        // باز و بسته شدن Drawer جزئیات آگهی
        function openDrawer(job) {
            document.getElementById('drawer-company').innerText = job.company.name;
            document.getElementById('drawer-content').innerHTML = `
                <h2 style="font-size: 18px; margin-bottom: 12px; font-weight: 800;">${job.title}</h2>
                <div style="display: flex; gap: 8px; margin-bottom: 20px;">
                    <span class="badge badge-salary">${job.workplace_type}</span>
                    <span class="badge badge-salary">${job.opportunity_type}</span>
                    <span class="badge badge-salary">${job.experience_level}</span>
                </div>
                <h4 style="font-size: 14px; font-weight: 700; margin-bottom: 8px;">درباره فرصت شغلی:</h4>
                <p style="color: #475569; margin-bottom: 20px;">${job.description_summary}</p>
                <h4 style="font-size: 14px; font-weight: 700; margin-bottom: 8px;">موقعیت فیزیکی:</h4>
                <p style="color: #475569;">📍 ${job.location_summary || 'ثبت شده در نقشه'}</p>
            `;
            document.getElementById('apply-modal-job-title').innerText = `${job.title} در ${job.company.name}`;
            document.getElementById('job-drawer').classList.add('open');
        }

        function closeDrawer() {
            document.getElementById('job-drawer').classList.remove('open');
        }

        // مودال Apply
        function openApplyModal() { document.getElementById('apply-modal').classList.add('active'); }
        function closeApplyModal() { document.getElementById('apply-modal').classList.remove('active'); }

        async function submitApplication() {
            if (!activeJobId) return;
            const cover = document.getElementById('apply-cover-letter').value;

            // ارسال درخواست همکاری به BIZ_API
            try {
                // ثبت به عنوان ردیابی اپلای
                await fetch(`${BIZ_API}/api/v1/opportunities/${activeJobId}/track-click`, { method: 'POST' });
                alert('درخواست همکاری شما با موفقیت برای کارفرما ثبت و ارسال گردید!');
                closeApplyModal();
                closeDrawer();
            } catch (err) {
                alert('خطا در ارسال درخواست.');
            }
        }

        // رویداد کلیک روی پین‌های نقشه -> باز شدن کارت متناظر
        map.on('click', 'employer_markers', (e) => {
            const jobId = e.features[0].properties.id;
            const job = currentJobs.find(j => j.id === jobId);
            if (job) selectJob(job);
        });

        // نشانگر ماوس روی مارکرها
        map.on('mouseenter', 'employer_markers', () => { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', 'employer_markers', () => { map.getCanvas().style.cursor = ''; });

        // رویداد جابجایی نقشه
        map.on('moveend', fetchJobsInViewport);
        map.on('load', fetchJobsInViewport);

        // پرش به شهر
        function setCityFilter(cityName, lng, lat, zoom, btn) {
            document.querySelectorAll('.filters-scroll .chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            map.flyTo({ center: [lng, lat], zoom: zoom, essential: true });
        }

        function toggleRemoteFilter(btn) {
            isRemoteOnly = !isRemoteOnly;
            btn.classList.toggle('active', isRemoteOnly);
            fetchJobsInViewport();
        }

        function handleSearchInput(e) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(fetchJobsInViewport, 350);
        }

        // کنترل سایدبار در موبایل
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const isExpanded = sidebar.classList.toggle('mobile-expanded');
            document.getElementById('mobile-toggle-text').innerText = isExpanded ? 'نمایش نقشه' : 'مشاهده لیست';
        }

        // بررسی سلامت سرورها
        async function checkApis() {
            try {
                const rMap = await fetch(`${MAP_API}/healthz`);
                document.getElementById('status-map').className = rMap.ok ? 'status-pill status-online' : 'status-pill status-offline';
            } catch { document.getElementById('status-map').className = 'status-pill status-offline'; }

            try {
                const rBiz = await fetch(`${BIZ_API}/api/v1/opportunities/search?limit=1`);
                document.getElementById('status-biz').className = rBiz.ok ? 'status-pill status-online' : 'status-pill status-offline';
            } catch { document.getElementById('status-biz').className = 'status-pill status-offline'; }
        }
        setInterval(checkApis, 10000);
        checkApis();
    </script>
</body>
</html>
